name: Deploy to ECS

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build Docker image
        run: |
          docker build -t realestate .

      - name: Tag image
        run: |
          docker tag realestate:latest 566540245375.dkr.ecr.ap-northeast-2.amazonaws.com/realestate:latest

      - name: Push image to ECR
        run: |
          docker push 566540245375.dkr.ecr.ap-northeast-2.amazonaws.com/realestate:latest

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster realestate-cluster \
            --service realestate-service3 \
            --force-new-deployment
